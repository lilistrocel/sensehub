# SenseHub MQTT broker (eclipse-mosquitto 2.0) — see mosquitto/README.md
#
# LAN-facing, plain MQTT (no TLS) on 0.0.0.0:1883. Container runs with
# network_mode: host, so the port is the host's 1883 (LAN 192.168.1.100 and the
# tailnet). Never port-forward it on the router and never put it behind cloudflared.

per_listener_settings false
listener 1883 0.0.0.0
protocol mqtt

# --- auth: no anonymous clients; hashed passwords; per-user topic ACL ---
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# --- persistence: retained messages (status/LWT, meta, irrigation state/report)
# and QoS1 sessions survive broker restarts ---
persistence true
persistence_location /mosquitto/data/
autosave_interval 300
# Forget persistent (clean_session=false) sessions of clients gone for > 7 days.
persistent_client_expiration 7d

# --- limits: the largest legitimate payload is the device meta (a few KB) ---
max_packet_size 131072
max_connections 64
max_keepalive 300
max_inflight_messages 20
max_queued_messages 1000
memory_limit 50331648

# --- logging: stdout -> docker json-file (rotated in docker-compose.yml).
# Connect/disconnect notices are few; nothing per message. ---
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S
